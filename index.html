<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ritmo Cardiologia — Painel do consultório</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f3f6f6">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f5560'/><path d='M4 17h6l2-4 3 9 3-14 2.5 9H28' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app" hidden>
    <aside class="lateral" id="lateral" aria-label="Menu do painel">
      <a href="#/" class="marca" aria-label="Ritmo Cardiologia, agenda">
        <span class="marca-sinal" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="20" height="20"><path d="M3 17h6l2-4 3 9 3-14 2.5 9H29" fill="none" stroke="white" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </span>
        <span class="marca-txt"><b id="nome-consultorio">Ritmo Cardiologia</b><span class="sub">Painel do consultório</span></span>
      </a>

      <button type="button" class="busca-btn" id="abrir-busca">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Buscar</span><kbd>Ctrl K</kbd>
      </button>

      <nav class="nav" id="nav" aria-label="Seções">
        <span class="nav-grupo">Atendimento</span>
        <a href="#/" data-aba="">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 13.5h3M7.5 17h3M13.5 13.5h3"/></svg>
          <span>Agenda</span><span class="contagem" id="cont-agenda"></span>
        </a>
        <a href="#/hoje" data-aba="hoje">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12h4l2-5 3.5 10 2.5-7 1.5 2h5.5"/></svg>
          <span>Resumo do dia</span>
        </a>
        <a href="#/pacientes" data-aba="pacientes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.1-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.7.7 2.7 2.4 3 5.2"/></svg>
          <span>Pacientes e prontuário</span><span class="contagem acento" id="cont-novos" title="Novos contatos"></span>
        </a>
        <span class="nav-grupo">Consultório</span>
        <a href="#/servicos" data-aba="servicos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5h8M9.5 3.5v5.2L4.6 17.4A2 2 0 0 0 6.4 20.5h11.2a2 2 0 0 0 1.8-3.1L14.5 8.7V3.5"/><path d="M7 14.5h10"/></svg>
          <span>Exames e consultas</span>
        </a>
        <a href="#/divulgacao" data-aba="divulgacao">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4a1 1 0 0 0 1 1h2l6 4.5v-15L7 9H5a1 1 0 0 0-1 1Z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></svg>
          <span>Divulgação</span>
        </a>
        <a href="#/consultorio" data-aba="consultorio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
          <span>Consultório</span>
        </a>
      </nav>

      <div class="lateral-rodape">
        <div class="demo-aviso"><span class="ponto"></span>Demonstração com dados fictícios</div>
        <div class="usuario">
          <span class="iniciais-sm" aria-hidden="true">RC</span>
          <span class="usuario-txt"><b>Recepção</b><span>recepcao@ritmocardio.demo</span></span>
          <button type="button" class="icone-btn" id="abrir-menu" aria-label="Mais opções" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
          </button>
          <div class="menu-pop" id="menu" hidden>
            <a href="#/consultorio">Dados do consultório</a>
            <button type="button" data-acao="recomecar">Recomeçar do zero</button>
            <hr>
            <button type="button" data-acao="sair" style="color:var(--alert)">Sair</button>
          </div>
        </div>
      </div>
    </aside>
    <div class="veu-lateral" id="veu-lateral" data-acao="fechar-lateral"></div>

    <div class="principal">
      <header class="barra-cel">
        <button type="button" class="icone-btn" id="abrir-lateral" aria-label="Abrir menu" aria-controls="lateral" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <span class="marca-sinal" aria-hidden="true"><svg viewBox="0 0 32 32" width="18" height="18"><path d="M3 17h6l2-4 3 9 3-14 2.5 9H29" fill="none" stroke="white" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
        <b class="cel-titulo" id="cel-titulo">Agenda</b>
        <button type="button" class="icone-btn" id="abrir-busca-cel" aria-label="Buscar">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </header>
      <main id="view" aria-live="polite"></main>
    </div>
  </div>
  <div id="camada"></div>
  <div class="toasts" id="toasts" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
